name: Verify and PR image
on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check Go formatting, vet and race tests
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test -race ./...
      - name: Install browser tests
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.0
      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: vdome-intercom:ci
          cache-from: type=gha,scope=build
          cache-to: type=gha,scope=build,mode=max
      - name: Verify minimal FFmpeg and start isolated demo
        run: |
          sh scripts/container-smoke.sh vdome-intercom:ci
          sh scripts/tls-smoke.sh vdome-intercom:ci
          docker run -d --name vdome-ci -p 127.0.0.1:8082:8080 --read-only --tmpfs /tmp:rw,size=128m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true -e VDOME_PROVIDER=demo -e VDOME_MEMORY_ONLY=1 -e VDOME_ORIGIN=http://127.0.0.1:8082 vdome-intercom:ci
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8082/healthz
      - name: Browser tests against production image
        working-directory: web
        env:
          VDOME_E2E_URL: http://127.0.0.1:8082
        run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-results
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: docker logs vdome-ci || true
      - name: Stop demo
        if: always()
        run: docker rm -fv vdome-ci || true
  publish-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      source_ref: ${{ github.sha }}
      tag: dev-${{ github.event.pull_request.number }}
