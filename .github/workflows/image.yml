name: Native multiarch image
on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit or release tag to build
        required: true
        type: string
      tag:
        description: dev-N or existing GitHub Release vMAJOR.MINOR.PATCH
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - name: Validate source and image tag
        id: meta
        env:
          IMAGE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$IMAGE_TAG" =~ ^dev-[1-9][0-9]*$ ]]; then
            : # Preview tags never update release tags or latest.
          elif [[ "$IMAGE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            test "$IMAGE_TAG" = "v$(jq -r .version web/package.json)"
            test "$(git rev-parse HEAD)" = "$(git rev-parse "$IMAGE_TAG^{commit}")"
            git merge-base --is-ancestor HEAD origin/main
            gh release view "$IMAGE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          else
            echo 'Expected dev-N or a published release vMAJOR.MINOR.PATCH' >&2
            exit 1
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, platform: linux/amd64, arch: amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push by digest on native hardware
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ inputs.tag }}
          cache-from: type=gha,scope=native-${{ matrix.arch }}
          cache-to: type=gha,scope=native-${{ matrix.arch }},mode=max
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          digest="${DIGEST#sha256:}"
          [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/$digest"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: container-tag-publication-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish manifest and check latest immediately before promotion
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          IMAGE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tags=(--tag "$IMAGE:$IMAGE_TAG")
          if [[ "$IMAGE_TAG" == v* ]]; then
            tags+=(--tag "$IMAGE:${IMAGE_TAG#v}")
            release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$IMAGE_TAG")
            if [[ $(jq -r .prerelease <<< "$release") == false && "$IMAGE_TAG" != *-* ]]; then
              latest_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .id)
              if [[ $(jq -r .id <<< "$release") == "$latest_id" ]]; then tags+=(--tag "$IMAGE:latest"); fi
            fi
          fi
          refs=()
          for file in "$RUNNER_TEMP"/digests/*; do
            digest="${file##*/}"
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            refs+=("$IMAGE@sha256:$digest")
          done
          test "${#refs[@]}" -eq 2
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG"
