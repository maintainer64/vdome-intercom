name: Release image
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  # Tests run on branches and PRs; releases only compile/publish exact tag sources.
  publish:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      source_ref: refs/tags/${{ github.event.release.tag_name }}
      tag: ${{ github.event.release.tag_name }}
